name: Deploy web (Cloudflare Pages)

# Builds the PWA in app/ and deploys it to Cloudflare Pages on every push to main.
# Required repo secret:
#   CLOUDFLARE_API_TOKEN  — token with "Account · Cloudflare Pages · Edit" permission
# Account id is public and hard-coded below.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5b7e398b42211bcb3ef301986c3dec3a
          workingDirectory: app
          command: >-
            pages deploy dist
            --project-name=flirtpilot
            --branch=main
            --commit-dirty=true
